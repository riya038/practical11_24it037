version: '3.8'

services:
  # ==========================================================
  # 1. MongoDB Database Service
  # ==========================================================
  mongodb:
    image: mongo:latest
    container_name: taskflow-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # ==========================================================
  # 2. Node.js / Express Backend Service
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=super_secret_jwt_key_practical11_itue301_charusat_24it037
      - JWT_EXPIRES_IN=1h
    depends_on:
      - mongodb
    networks:
      - app-network

  # ==========================================================
  # 3. React Frontend Service (Built + Served via Vite preview)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network

# ============================================================
# Persistent Named Volume for MongoDB Data (Supplementary Task)
# ============================================================
volumes:
  mongo-data:
    driver: local

# ============================================================
# User-Defined Bridge Network (app-network)
# ============================================================
networks:
  app-network:
    driver: bridge

